version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: swasthyasetu-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swasthyasetu-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/swasthyasetu
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:

